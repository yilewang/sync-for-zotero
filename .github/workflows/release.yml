name: Release Extension

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Build the Chrome package (.zip)
      - name: Zip extension folder (Chrome)
        run: zip -r extension.zip extension/

      # 2. Build the Firefox package (.xpi) on the fly from the Chrome source
      - name: Generate and build Firefox package (XPI)
        run: |
          # Create a temporary folder for the Firefox build
          cp -r extension extension-firefox-build
          cd extension-firefox-build
          
          # Remove importScripts from background.js since Firefox event pages do not support it
          sed -i 's/importScripts("webchat_shared.js");/\/\/ importScripts removed for Firefox/g' background.js
          
          # Modify manifest.json dynamically using jq for Firefox compatibility
          jq '
            del(.minimum_chrome_version) | 
            .browser_specific_settings = {"gecko": {"id": "sync-for-zotero@unipd.it", "strict_min_version": "115.0"}} | 
            del(.background.service_worker) | 
            .background.scripts = ["webchat_shared.js", "background.js"] | 
            del(.content_scripts[] | select(.world == "MAIN"))
          ' manifest.json > manifest_tmp.json
          mv manifest_tmp.json manifest.json
          
          # Package the .xpi by zipping from inside the folder (Firefox requires manifest.json at the root)
          zip -r ../extension-firefox.xpi *
          cd ..

      # 3. Upload both assets (Chrome .zip and Firefox .xpi) to the published release
      - name: Upload to release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" extension.zip --clobber
          gh release upload "${{ github.event.release.tag_name }}" extension-firefox.xpi --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
