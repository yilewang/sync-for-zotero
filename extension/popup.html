<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sync for Zotero</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      width: 280px;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      color: #a78bfa;
      margin-bottom: 14px;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .status-badge {
      padding: 9px 11px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
    }

    .idle    { background: #1e3a5f; color: #9ca3af; }
    .running { background: #1c3a5e; color: #60a5fa; }
    .done    { background: #14532d; color: #4ade80; }
    .error   { background: #450a0a; color: #f87171; }
    .busy    { background: #44403c; color: #fbbf24; }

    .hint {
      margin-top: 14px;
      font-size: 11px;
      color: #4b5563;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>📚 Sync for Zotero</h1>

  <div class="label">Pipeline Status</div>
  <div class="status-badge idle" id="status-badge">
    Idle — use the desktop GUI to submit queries.
  </div>

  <p class="hint" id="hint">Start the GUI: <code>python3 gui.py</code></p>

  <script src="popup.js"></script>
</body>
</html>
